<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #map { width: 100vw; height: 100vh; }
  #legend {
    position: fixed; bottom: 24px; right: 24px;
    background: rgba(17,17,27,0.92); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 16px;
    color: #e2e8f0; font-size: 13px;
    min-width: 180px; z-index: 1000;
  }
  #legend h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; opacity: 0.8; }
  .legend-item:hover { opacity: 1; }
  .legend-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-item .line { width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0; }
  .legend-item .square { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .legend-item .toggle-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-item-label { flex: 1; }
  .legend-item .count { color: #64748b; font-size: 11px; }
  #title {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(17,17,27,0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px 20px;
    color: #e2e8f0; font-size: 15px; font-weight: 600;
    z-index: 1000; direction: rtl;
  }
  #title span { color: #facc15; }
  #stats {
    position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; direction: ltr; z-index: 1000;
  }
  .stat-box {
    background: rgba(17,17,27,0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 6px 12px;
    color: #e2e8f0; font-size: 12px;
  }
  .stat-box .num { font-weight: 600; color: #facc15; }
  #popup-content { direction: rtl; font-size: 13px; }
  #popup-content h4 { margin-bottom: 4px; font-size: 14px; }
  #popup-content .info { color: #94a3b8; }
  .maplibregl-popup-content { background: rgba(17,17,27,0.95) !important; color: #e2e8f0 !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 8px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important; padding: 12px 16px !important; }
  .maplibregl-popup-tip { border-top-color: rgba(17,17,27,0.95) !important; }
  .maplibregl-popup-close-button { color: #64748b !important; font-size: 16px !important; }
  .maplibregl-ctrl-attrib { display: none !important; }
  @media (max-width: 768px) {
    #legend { top: auto; bottom: 16px; right: 16px; padding: 12px; font-size: 11px; min-width: 140px; }
    #title { font-size: 13px; padding: 8px 14px; top: 8px; }
    #stats { top: 56px; }
    .stat-box { font-size: 10px; padding: 4px 8px; }
  }
</style>
</head>

    layout: {
      'text-field': ['get', 'point_count_abbreviated'],
      'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
      'text-size': 13
    },
    paint: { 'text-color': '#ffffff' }
  });

  // === UNCLUSTERED PLANTS ===
  map.addLayer({
    id: 'plants-unclustered',
    type: 'circle',
    source: 'plants',
    filter: ['!', ['has', 'point_count']],
    paint: {
      'circle-color': ['match', ['get', 'fuel'], ...Object.entries(fuelColors).flat()],
      'circle-radius': ['*', ['sqrt', ['to-number', ['coalesce', ['get', 'capacity'], '10']]], 0.2],
      'circle-stroke-width': 1.5,
      'circle-stroke-color': '#ffffff',
      'circle-opacity': 0.85
    }
  });

  // === SUBSTATIONS SOURCE ===
  map.addSource('subs', {
    type: 'geojson',
    data: {
      type: 'FeatureCollection',
      features: substations
    }
  });

  map.addLayer({
    id: 'subs-layer',
    type: 'circle',
    source: 'subs',
    paint: {
      'circle-color': '#a78bfa',
      'circle-radius': ['match', ['get', 'voltage'], '400 kV', 10, '400/161 kV', 9, 7],
      'circle-stroke-width': 2,
      'circle-stroke-color': '#6d28d9',
      'circle-opacity': 0.8
    }
  });

  map.addLayer({
    id: 'subs-label',
    type: 'symbol',
    source: 'subs',
    layout: {
      'text-field': ['get', 'name'],
      'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
      'text-size': 10,
      'text-offset': [0, 1.5],
      'text-anchor': 'top'
    },
    paint: {
      'text-color': '#a78bfa',
      'text-halo-color': 'rgba(0,0,0,0.6)',
      'text-halo-width': 1
    }
  });

  // === POPUPS ===
  map.on('click', 'plants-unclustered', (e) => {
    const p = e.features[0].properties;
    const f = fuelLabels[p.fuel] || p.fuel;
    const cap = p.capacity ? `${p.capacity} MW` : 'N/A';
    const yr = p.year || 'N/A';
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`
        <div id="popup-content">
          <h4>${p.name}</h4>
          <div class="info">סוג דלק: ${f}</div>
          <div class="info">קיבולת: ${cap}</div>
          <div class="info">שנה: ${yr}</div>
          <div class="info">קואורדינטות: ${p.lat}, ${p.lon}</div>
        </div>
      `)
      .addTo(map);
  });

  map.on('click', 'subs-layer', (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`
        <div id="popup-content">
          <h4>⚡ ${p.name}</h4>
          <div class="info">מתח: ${p.voltage}</div>
          <div class="info">סוג: ${p.type}</div>
        </div>
      `)
      .addTo(map);
  });

  // Click on cluster → zoom in
  map.on('click', 'clusters', (e) => {
    const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
    const clusterId = features[0].properties.cluster_id;
    map.getSource('plants').getClusterExpansionZoom(clusterId, (err, zoom) => {
      if (err) return;
      map.easeTo({ center: features[0].geometry.coordinates, zoom });
    });
  });

  map.on('mouseenter', 'plants-unclustered', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'plants-unclustered', () => { map.getCanvas().style.cursor = ''; });
  map.on('mouseenter', 'subs-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'subs-layer', () => { map.getCanvas().style.cursor = ''; });

  // === LAYER TOGGLE ===
  let plantsVisible = true, subsVisible = true;
  
  document.getElementById('toggle-plants').onclick = () => {
    plantsVisible = !plantsVisible;
    ['plants-unclustered', 'clusters', 'cluster-count'].forEach(id => {
      map.setLayoutProperty(id, 'visibility', plantsVisible ? 'visible' : 'none');
    });
    document.getElementById('toggle-plants').style.opacity = plantsVisible ? '0.8' : '0.3';
  };

  document.getElementById('toggle-subs').onclick = () => {
    subsVisible = !subsVisible;
    ['subs-layer', 'subs-label'].forEach(id => {
      map.setLayoutProperty(id, 'visibility', subsVisible ? 'visible' : 'none');
    });
    document.getElementById('toggle-subs').style.opacity = subsVisible ? '0.8' : '0.3';
  };
});
</script>
</body>
</html>
